name: Feature request
description: Propose a focused improvement to Sor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What terminal workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What do you use today, and why is it insufficient?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request keeps command execution under the user's control.
          required: true
        - label: I searched existing issues and the roadmap for this idea.
          required: true
