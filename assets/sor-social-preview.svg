<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Sor — Ask your terminal</title>
  <desc id="description">A dark terminal-inspired banner for the Sor context-aware Codex companion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="0.58" stop-color="#101827"/>
      <stop offset="1" stop-color="#10241f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.24" r="0.75">
      <stop offset="0" stop-color="#45e0a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#45e0a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#glow)"/>

  <g opacity="0.16" stroke="#6ee7b7" stroke-width="1">
    <path d="M0 96H1280M0 192H1280M0 288H1280M0 384H1280M0 480H1280M0 576H1280"/>
    <path d="M96 0V640M192 0V640M288 0V640M384 0V640M480 0V640M576 0V640M672 0V640M768 0V640M864 0V640M960 0V640M1056 0V640M1152 0V640"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="86" width="1096" height="468" rx="24" fill="#0a0f19" stroke="#273449" stroke-width="2"/>
    <path d="M92 158H1188" stroke="#273449" stroke-width="2"/>
    <circle cx="136" cy="122" r="8" fill="#ff6b6b"/>
    <circle cx="166" cy="122" r="8" fill="#f7c948"/>
    <circle cx="196" cy="122" r="8" fill="#45d483"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="142" y="258" font-size="72" font-weight="700" fill="#f5f7fb">
      <tspan fill="#45e0a8">❯</tspan><tspan> sor</tspan>
    </text>
    <text x="142" y="350" font-size="56" font-weight="600" fill="#f5f7fb">Ask your terminal.</text>
    <text x="142" y="414" font-size="28" fill="#aebbd0">Context-aware answers from your current shell session.</text>
    <text x="142" y="486" font-size="22" fill="#6f809a">Linux  ·  Bash  ·  Codex app-server</text>
  </g>

  <g transform="translate(1012 222)">
    <rect width="104" height="104" rx="28" fill="#45e0a8"/>
    <path d="M31 34L49 52L31 70" fill="none" stroke="#07120e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 72H78" stroke="#07120e" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
